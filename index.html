<!-- Bootstrap-only fallback: Prefabs cannot render before the Cocos engine starts. -->
<style>
#game-boot-error[hidden]{display:none}
#game-boot-error{position:fixed;inset:0;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;background:rgba(0,0,0,.88);color:#fff;text-align:center;font:20px sans-serif}
#game-boot-error h1{font-size:28px;margin:0}
#game-boot-error p{font-size:17px;max-width:580px;margin:0;line-height:1.5;color:#cbd9e5}
#game-boot-error button{border:1px solid #68d9ff;border-radius:10px;padding:14px 36px;background:#1765b8;color:#fff;font:bold 20px sans-serif;cursor:pointer}
</style>
<section id="game-boot-error" role="alert" hidden>
  <h1 id="game-boot-title">Unable to start the game</h1>
  <p id="game-boot-detail">Please check your connection and reload. Your saved progress will be kept.</p>
  <button id="game-boot-retry" type="button">Reload</button>
</section>
<script>
(function(){
  var ready=false,panel=document.getElementById('game-boot-error');
  var fail=function(){if(!ready)panel.hidden=false;};
  var timer=setTimeout(fail,45000);
  if(new URLSearchParams(location.search).get('lang')==='zh-CN'){
    document.getElementById('game-boot-title').textContent='游戏启动未完成';
    document.getElementById('game-boot-detail').textContent='请检查网络后重新加载，已有存档会保留。';
    document.getElementById('game-boot-retry').textContent='重新加载';
  }
  var done=function(){
    ready=true;clearTimeout(timer);panel.hidden=true;
    window.removeEventListener('error',fail,true);
    window.removeEventListener('unhandledrejection',fail);
    window.removeEventListener('march:boot-error',fail);
    window.removeEventListener('march:runtime-ready',done);
  };
  document.getElementById('game-boot-retry').addEventListener('click',function(){location.reload();});
  window.addEventListener('error',fail,true);
  window.addEventListener('unhandledrejection',fail);
  window.addEventListener('march:boot-error',fail);
  window.addEventListener('march:runtime-ready',done);
})();
</script>
